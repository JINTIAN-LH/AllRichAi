services:
  - type: web
    name: allrichai-farmgame-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_web.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLRICHAI_WEB_HOST
        value: 0.0.0.0
